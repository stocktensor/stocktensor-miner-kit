[project]
name = "stocktensor-miner-kit"
version = "0.1.0"
description = "Starter models, Chainlink price data and a local backtest using the exact Stocktensor validator scoring."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
authors = [{ name = "Stocktensor", email = "tao@stocktensor.io" }]
keywords = ["bittensor", "mining", "forecasting", "backtesting", "robinhood-chain"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["stocktensor-subnet @ git+https://github.com/stocktensor/stocktensor-subnet@v0.1.0"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.5,<2"]

[project.urls]
Homepage = "https://stocktensor.io"
Repository = "https://github.com/stocktensor/stocktensor-miner-kit"

[project.scripts]
stx-data = "stocktensor_kit.cli:data_main"
stx-backtest = "stocktensor_kit.cli:backtest_main"
stx-serve = "stocktensor_kit.cli:serve_main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stocktensor_kit"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
